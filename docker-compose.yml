services:
  # --- Point d'entrée unique (seul port exposé) ---
  gateway:
    build: ../poketeam-gateway
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DRESSEURS_URL: http://dresseurs:8001
      EQUIPES_URL: http://equipes:8002
      POKEDEX_URL: http://pokedex:8000
      CORS_ORIGIN: http://localhost:4200
    depends_on:
      - dresseurs
      - equipes
      - pokedex

  # --- Microservice 1 : Dresseurs (Django + PostgreSQL) ---
  dresseurs:
    build: ../poketeam-dresseurs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: dresseurs
      POSTGRES_USER: poke
      POSTGRES_PASSWORD: poke
      JWT_SECRET: ${JWT_SECRET}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Microservice 2 : Équipes (Django + MongoDB) ---
  equipes:
    build: ../poketeam-equipes
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: equipes
      POKEDEX_URL: http://pokedex:8000
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    depends_on:
      - mongo
      - pokedex

  # --- Microservice 3 : Pokédex (sans état) ---
  pokedex:
    build: ../poketeam-pokedex
    environment:
      POKEAPI_URL: https://pokeapi.co/api/v2

  # --- Bases de données (non exposées) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poke
      POSTGRES_PASSWORD: poke
      POSTGRES_DB: dresseurs
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poke -d dresseurs"]
      interval: 3s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
